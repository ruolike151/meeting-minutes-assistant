<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议纪要助手</title>
<meta name="description" content="对话式会议纪要助手：音频进，带引用的答案出。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ---------- 左侧：会议库 ---------- -->
  <aside class="sidebar" id="sidebar" aria-label="会议库">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>会议纪要助手</strong>
        <small>对话式会议知识库</small>
      </span>
    </header>

    <button class="btn btn-primary btn-block" id="newChatBtn" type="button">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </button>

    <div class="lib">
      <div class="lib-head">
        <span class="lib-title">会议库</span>
        <span class="lib-count" id="meetingCount">0</span>
      </div>

      <label class="field-search">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="meetingSearch" type="search" placeholder="搜索会议、参会人" aria-label="搜索会议或参会人">
      </label>

      <ul class="meeting-list" id="meetingList"></ul>

      <p class="lib-empty" id="libEmpty" hidden>没有匹配的会议</p>
    </div>

    <footer class="sidebar-foot">
      <button class="btn btn-ghost btn-block" id="speakerBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        发言人库
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅色主题">
        <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </footer>
  </aside>

  <!-- ---------- 中间：对话区 ---------- -->
  <main class="chat" aria-label="助手对话">
    <header class="chat-head">
      <button class="icon-btn sidebar-toggle" id="sidebarToggle" type="button" aria-label="展开会议库">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="chat-title">
        <h1 id="chatTitle">全局对话</h1>
        <p id="chatSubtitle">可查询任意会议，或上传录音生成纪要</p>
      </div>
      <div class="chat-actions">
        <button class="chip scope-chip" id="scopeChip" type="button"
                title="切换提问范围：全部会议 / 单场会议">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span id="scopeChipText">全部会议</span>
          <span class="scope-x" id="scopeChipClear" hidden aria-hidden="true">✕</span>
        </button>
        <button class="btn btn-ghost btn-export" id="exportBtn" type="button">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          导出
        </button>
      </div>
    </header>

    <div class="stream" id="stream" role="log" aria-live="polite" aria-relevant="additions text"></div>

    <div class="composer">
      <div class="attach-chip" id="attachChip" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
        <span class="attach-name" id="attachName"></span>
        <span class="attach-size" id="attachSize"></span>
        <button class="chip-x" id="attachRemove" type="button" aria-label="移除音频">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <form class="composer-box" id="composerForm">
        <button class="icon-btn" id="attachBtn" type="button" aria-label="上传会议音频" title="上传会议音频">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21 12-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L16 7"/></svg>
        </button>
        <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.webm" hidden>
        <textarea id="input" rows="1" placeholder="问点什么，或拖入一段会议录音…" aria-label="输入消息"></textarea>
        <button class="btn btn-send" id="sendBtn" type="submit" aria-label="发送">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </form>

      <p class="composer-note">
        音频与转写文本会上传至第三方 LLM / ASR 服务 · 当前为 M1，音频走离线固定数据后端
      </p>
    </div>
  </main>

  <!-- ---------- 右侧：详情面板 ---------- -->
  <section class="panel" id="panel" aria-label="会议详情">
    <header class="panel-head">
      <div class="panel-meta">
        <h2 id="panelTitle">会议详情</h2>
        <p id="panelSub">从左侧会议库选择一场会议</p>
      </div>
      <button class="icon-btn panel-close" id="panelClose" type="button" aria-label="收起详情面板">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="minutes" aria-selected="true">纪要</button>
        <button class="tab" role="tab" data-tab="actions" aria-selected="false">待办</button>
        <button class="tab" role="tab" data-tab="review" aria-selected="false">待确认</button>
        <button class="tab" role="tab" data-tab="raw" aria-selected="false">原声</button>
      </div>
    </header>
    <div class="panel-body" id="panelBody"></div>
  </section>

</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="app.js"></script>
</body>
</html>
